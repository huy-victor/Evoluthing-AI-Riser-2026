<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evoluthing — The Notebook of Evolution</title>
<link href="https://fonts.googleapis.com/css2?family=Fuzzy+Bubbles:wght@400;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:Inter,ui-sans-serif,system-ui,sans-serif;
  background:
    radial-gradient(1200px 700px at 50% 30%, rgba(255,220,160,.10), transparent 60%),
    radial-gradient(900px 600px at 78% 82%, rgba(120,70,40,.16), transparent 62%),
    linear-gradient(160deg,#3a2c22 0%,#241a14 55%,#171009 100%);
  overflow:hidden;
  color:#3b3226;
}
.scene{height:100vh;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;box-sizing:border-box}

/* ===== the notebook — closed 640×820, spread 1160×820, cover overhang 16px ===== */
.book{
  position:relative;
  perspective:2400px;
  filter:drop-shadow(0 40px 60px rgba(0,0,0,.55));
  flex-shrink:0;
  width:min(640px, calc(100vw - 48px), calc((100vh - 48px) * 640 / 820));
  aspect-ratio:640 / 820;
  height:auto;
  background:
    radial-gradient(300px 200px at 70% 30%, rgba(255,255,255,.05), transparent 60%),
    linear-gradient(120deg,#b02f24 0%,#8f251c 45%,#741d15 100%);
  border-radius:8px 14px 14px 8px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25), inset 0 0 60px rgba(0,0,0,.30);
}
.book.spread{
  width:min(1200px, calc(100vw - 48px), calc((100vh - 48px) * 1200 / 820));
  aspect-ratio:1200 / 820;
}
.cover{position:absolute;inset:0;transform-origin:left center;backface-visibility:hidden;border-radius:8px 14px 14px 8px;overflow:hidden;z-index:10;cursor:pointer;
  background:
    radial-gradient(300px 200px at 70% 30%, rgba(255,255,255,.05), transparent 60%),
    linear-gradient(120deg,#b02f24 0%,#8f251c 45%,#741d15 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25), inset 0 0 60px rgba(0,0,0,.30);
  transition:transform .9s cubic-bezier(.4,.05,.15,1);
}
.spine{position:absolute;left:0;top:0;bottom:0;width:34px;background:linear-gradient(90deg,#2a2018,#4a3828 60%,#3a2c20);box-shadow:inset -3px 0 6px rgba(0,0,0,.35);z-index:2}
.spine::after{content:"";position:absolute;top:14px;bottom:14px;left:50%;width:2px;background:repeating-linear-gradient(180deg,rgba(0,0,0,.4) 0 6px,transparent 6px 14px)}
/* single page for prompt/loading/error — inset from cover to show overhang */
.page-single{position:absolute;inset:12px 16px 12px 16px;transform-origin:left center;backface-visibility:hidden;border-radius:6px;overflow:hidden;
  background:
    repeating-linear-gradient(90deg, rgba(120,100,80,.05) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(180deg, rgba(120,100,80,.05) 0 1px, transparent 1px 28px),
    linear-gradient(90deg,#efe6d4 0%,#f7f0e2 30%,#f9f3e6 100%);
  padding:0 0 0 34px;
}
.page-single .inner{position:absolute;top:0;left:34px;right:0;bottom:0;padding:36px 36px 36px;display:flex;flex-direction:column;overflow:hidden}
.page-single .inner::before{content:"";position:absolute;top:0;left:0;right:0;height:10px;background:linear-gradient(180deg,rgba(0,0,0,.10),transparent)}
/* two-leaf spread block — the open book */
.page-block{position:absolute;inset:12px 16px 12px 16px;display:none;perspective:2400px;transform-style:preserve-3d;overflow:visible}
.book.spread .page-block{display:block}
.book.spread .page-single{display:none}
.book{transform-style:preserve-3d}
.binding{position:absolute;top:0;bottom:0;left:50%;width:60px;transform:translateX(-50%);pointer-events:none;z-index:5;
  background:linear-gradient(90deg,transparent 0%,rgba(90,70,45,.16) 42%,rgba(60,45,28,.30) 50%,rgba(90,70,45,.16) 58%,transparent 100%)}
.leaf{position:absolute;top:0;bottom:0;width:50%;background:
    repeating-linear-gradient(90deg, rgba(120,100,80,.05) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(180deg, rgba(120,100,80,.05) 0 1px, transparent 1px 28px),
    linear-gradient(90deg,#efe6d4 0%,#f7f0e2 30%,#f9f3e6 100%);
  overflow:hidden;backface-visibility:hidden;transition:transform .5s cubic-bezier(.22,.7,.2,1);will-change:transform;display:flex;flex-direction:column}
.leaf-left{left:0;border-radius:6px 0 0 6px;transform-origin:right center;border-right:1px dashed rgba(120,95,70,.22)}
.leaf-right{right:0;border-radius:0 6px 6px 0;transform-origin:left center}
.leaf-inner{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;padding:44px 30px 40px}
.leaf-left .leaf-inner{align-items:center;justify-content:center;gap:10px}
.leaf-right .leaf-inner{justify-content:center;text-align:left}
.left-meta{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;margin-top:6px}
.left-meta .mname{font-family:"Fuzzy Bubbles",cursive;font-size:26px;line-height:1.15;font-weight:400;-webkit-text-stroke:.45px currentColor;color:#2f251b;word-break:break-word}
.left-meta .myear{font-family:"Fuzzy Bubbles",cursive;font-size:17px;color:#8a7a5f;font-weight:400;-webkit-text-stroke:.45px currentColor}
.left-meta .wiki-source-wrap{margin-top:6px}
.pageno{position:absolute;bottom:12px;right:18px;font-family:"Fuzzy Bubbles",cursive;font-size:18px;color:#a2947d;-webkit-text-stroke:.45px currentColor;pointer-events:none;z-index:6}
.book.prompt .milestone-topbar{display:none}
.book.prompt .pageno{display:none}
/* prompt is a static page — flatten the 3D book context so the circle video's
   mix-blend-mode can composite against the cream leaf (3D context isolates blend) */
.book.prompt{perspective:none;transform-style:flat}
.book.prompt .page-block{perspective:none;transform-style:flat}
.book.prompt .leaf{backface-visibility:visible}

/* milestone top bar — inside right leaf, topic + icon */
.milestone-topbar{position:absolute;top:14px;right:18px;z-index:15;display:flex;align-items:center;gap:8px;max-width:calc(100% - 36px)}
.milestone-topic{font-family:"Playfair Display",serif;font-size:17px;font-style:italic;font-weight:700;color:#6b5a44;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.btn-reset-topic{width:28px;height:28px;padding:0;display:grid;place-items:center;background:rgba(120,95,70,.12);border:1px solid rgba(120,95,70,.25);border-radius:50%;font-size:16px;line-height:1;color:#5a4632;cursor:pointer;transition:all .2s ease;outline:none;flex-shrink:0}
.btn-reset-topic:hover{background:rgba(120,95,70,.22);transform:scale(1.06)}

.cover.open{transform:rotateY(-178deg)}
.cover .inner{position:absolute;top:0;left:34px;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 40px;padding:0 6.25cqw;text-align:center;z-index:3}
.deco-layer{position:absolute;z-index:3;pointer-events:none}
/* bìa là size container — mọi phần tử con dùng cqw để co giãn đúng tỷ lệ bìa (thiết kế gốc 640px, 1cqw = 6.4px thiết kế) */
.cover{container-type:inline-size}
.cover .deco-layer{left:44px;left:6.875cqw;top:26px;top:4.0625cqw;width:570px;width:89.0625cqw}
.cover h1{font-family:"Playfair Display",Georgia,serif;font-weight:800;font-size:54px;font-size:8.4375cqw;letter-spacing:.02em;color:#f6c94a;margin:0;text-shadow:0 2px 0 rgba(0,0,0,.35);text-shadow:0 .3125cqw 0 rgba(0,0,0,.35);paint-order:stroke fill}
.cover .tag{font-family:"Fuzzy Bubbles",cursive;font-size:24px;font-size:3.75cqw;color:#f6c94a;-webkit-text-stroke:.7px currentColor;margin-top:10px;margin-top:1.5625cqw;opacity:.92;paint-order:stroke fill}

/* clasp on right edge — pulses to invite opening */
.clasp{position:absolute;right:-6px;right:-.9375cqw;top:44%;width:44px;width:6.875cqw;height:64px;height:10cqw;background:linear-gradient(90deg,#4a3423,#6b4c33);border:2px solid rgba(0,0,0,.3);border:.3125cqw solid rgba(0,0,0,.3);border-radius:6px;border-radius:.9375cqw;display:grid;place-items:center;z-index:11;box-shadow:0 4px 10px rgba(0,0,0,.35);animation:invite 2.4s ease-in-out infinite}
.clasp .knob{width:22px;width:3.4375cqw;height:22px;height:3.4375cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8c98a,#9a7b45 70%,#6f5830);box-shadow:inset 0 2px 3px rgba(0,0,0,.4)}
@keyframes invite{
  0%,100%{box-shadow:0 4px 10px rgba(0,0,0,.35),0 0 0 0 rgba(232,201,138,0)}
  50%{box-shadow:0 4px 10px rgba(0,0,0,.35),0 0 0 12px rgba(232,201,138,.28)}
}
.cover.open .clasp{animation:none;opacity:0}

/* ===== language switch — bookmark ribbons on cover (config chot 28/08 qua cover-preview.html) ===== */
#coverLayerEN{position:absolute;inset:0;z-index:1;opacity:0;transition:opacity .35s ease;
  background:
    radial-gradient(300px 200px at 70% 30%, rgba(255,255,255,.05), transparent 60%),
    linear-gradient(120deg,#31527a 0%,#0a3161 45%,#0d2b4f 100%)}
.lang-ribbons{position:absolute;top:0;left:70px;left:10.9375cqw;z-index:12;display:flex;gap:7px;gap:1.09375cqw}
/* override song song với .spine gốc (trang đơn) — chỉ bìa mới co theo cqw */
.cover .spine{width:34px;width:5.3125cqw}
.cover .spine::after{top:14px;top:2.1875cqw;bottom:14px;bottom:2.1875cqw;width:2px;width:.3125cqw}
.ribbon{position:relative;cursor:pointer;overflow:hidden;
  transition:height .22s ease,filter .22s ease;
  box-shadow:0 2px 6px rgba(0,0,0,.4);
  clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 11px),0 100%)}
.ribbon:hover{filter:brightness(1.08)}
.rb-inner{position:absolute;clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 9.5px),0 100%)}
.rb-inner svg{position:absolute;inset:0;width:100%;height:100%}
.rb-inner .rb-star{position:absolute;left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:58%;height:auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.ribbon.active{z-index:13}

/* ===== prompt page ===== */
.prompt-wrap{display:flex;flex-direction:column;height:100%;justify-content:center;padding:10px 10px 30px}
.prompt-title{font-family:"Fuzzy Bubbles",cursive;font-size:28px;line-height:1.35;margin-top:0;font-weight:400;-webkit-text-stroke:.7px currentColor;text-align:center;color:#3b3023}
.prompt-input-wrap{position:relative;margin:32px 0 24px}
.prompt-input{width:100%;background:transparent;border:none;outline:none;
  font-family:"Fuzzy Bubbles",cursive;font-size:36px;color:#3b3226;padding:6px 4px 18px;caret-color:#8a6a3f;text-align:center;-webkit-text-stroke:.7px currentColor}
.prompt-input::placeholder{color:#cfc1a4;opacity:.8}
.typed-placeholder{
  position:absolute;left:4px;right:4px;top:6px;bottom:18px;
  display:flex;align-items:center;justify-content:center;
  font-family:"Fuzzy Bubbles",cursive;font-size:36px;color:#cfc1a4;opacity:.8;-webkit-text-stroke:.7px currentColor;
  pointer-events:none;white-space:nowrap;overflow:hidden;
}
.typed-placeholder.hidden{opacity:0;visibility:hidden}
.typed-text{white-space:nowrap}
.typed-caret{display:inline-block;margin-left:1px;width:2px;height:1.05em;background:#8a6a3f;opacity:1;vertical-align:middle;transform:translateY(-1px);animation:typedBlink 1s step-end infinite}
@keyframes typedBlink{0%,50%{opacity:1}51%,100%{opacity:0}}
/* hand-drawn underline beneath the input */
.prompt-line{position:absolute;left:2%;right:2%;bottom:0;height:44px;pointer-events:none;overflow:visible}
.prompt-line img{width:100%;height:100%;object-fit:fill;display:block;opacity:.95}

.prompt-actions{display:flex;justify-content:center;margin-top:10px}
.btn-explore-circle{
  position:relative;display:grid;place-items:center;
  width:var(--circle-w,220px);height:var(--circle-h,180px);
  flex-shrink:0;cursor:pointer;
}
.circle-draw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.circle-draw img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
.btn-explore{
  position:relative;z-index:1;
  font-family:"Fuzzy Bubbles",cursive;font-size:var(--btn-font,20px);font-weight:400;-webkit-text-stroke:.45px currentColor;
  color:var(--btn-text,#3b3226);background:transparent;border:none;
  cursor:pointer;padding:0 18px;line-height:1;text-align:center;white-space:nowrap;translate:0 0;transition:translate .16s ease;
}
.btn-explore:hover{translate:0 -1px}
/* hover: text grows inside the fixed hand-drawn circle */
.btn-circle-hover{transition:filter .18s ease}
.btn-circle-hover .btn-explore{transition:translate .16s ease,transform .18s ease}
.btn-circle-hover:hover{filter:drop-shadow(0 10px 12px rgba(40,25,10,.35))}
.btn-circle-hover:hover .btn-explore{transform:scale(1.15)}

/* BYOK — optional user API key */
.suggestions-title{font-family:"Fuzzy Bubbles",cursive;font-size:21px;color:#8a7860;-webkit-text-stroke:.45px currentColor;text-align:center;margin-top:36px}
.suggestions-grid{display:flex;flex-wrap:wrap;gap:6px 26px;justify-content:center;margin-top:10px}
/* guide page — left leaf of the prompt spread (config chot 27/08 qua guide-preview.html) */
.guide-wrap{display:flex;flex-direction:column;justify-content:center;width:100%;height:100%;padding-top:4px}
.guide-title{font-family:"Fuzzy Bubbles",cursive;font-weight:700;font-size:26px;line-height:1.35;color:#3b3023;-webkit-text-stroke:.7px currentColor;text-align:center;margin:0}
.guide-title-line{margin-top:6px}
.guide-title-line img{width:min(440px,76%);height:36px;object-fit:fill;display:block;margin:0 auto;opacity:.92}
.guide-steps{margin-top:17px;display:flex;flex-direction:column;gap:16px}
.guide-step{display:flex;gap:10px;align-items:flex-start}
.guide-step .marker{flex-shrink:0;font-family:"Fuzzy Bubbles",cursive;font-weight:700;color:#8a5a34;-webkit-text-stroke:.5px currentColor;line-height:1.3}
.guide-step .marker.num{font-size:21px}
.guide-step p{margin:0;font-family:"Fuzzy Bubbles",cursive;font-size:20px;line-height:1.5;color:#3b3226;-webkit-text-stroke:.45px currentColor}
.guide-keybox{margin-top:10px;width:100%;display:flex;justify-content:center}
.guide-keybox .guide-key-field{position:relative;width:min(320px,88%)}
.guide-keybox input{width:100%;padding:8px 34px 8px 12px;border:1.5px dashed rgba(120,95,70,.4);border-radius:9px;background:#fdfaf3;font-family:Inter,sans-serif;font-size:13px;color:#3b3226;outline:none}
.guide-keybox input:focus{border-color:#8a6a3f;background:#fff}
.guide-key-clear{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:20px;height:20px;padding:0;border:none;border-radius:50%;background:rgba(176,72,58,.14);color:#b0483a;font-size:11px;line-height:1;cursor:pointer;display:grid;place-items:center}
.guide-key-clear:hover{background:#b0483a;color:#fdfaf3}
/* màn thấp — co phần hướng dẫn để 5 bước + ô key vẫn vừa trang */
@media(max-height:820px){
  .guide-title{font-size:21px}
  .guide-step p{font-size:17px}
  .guide-steps{margin-top:12px;gap:12px}
  .guide-keybox input{padding:6px 30px 6px 10px;font-size:12px}
}
.sug-chip{
  font-family:"Fuzzy Bubbles",cursive;font-size:18px;-webkit-text-stroke:.45px currentColor;
  background:transparent;border:none;padding:0;
  color:#4f3f2d;cursor:pointer;transition:color .18s ease,transform .18s ease;
}
.sug-chip:nth-child(2n){transform:rotate(-1.2deg)}
.sug-chip:nth-child(3n){transform:rotate(1.4deg)}
.sug-chip:hover{color:#2a2014;transform:scale(1.06)}

/* ===== loading ===== */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:20px}
.loading .pen{font-size:56px;animation:bob 1.1s ease-in-out infinite}
.loading .topic-title{font-family:"Playfair Display",serif;font-size:28px;font-weight:700;color:#5a3f2b;margin-top:20px;height:80px;display:flex;align-items:center;justify-content:center}
.loading .msg{margin-top:14px;font-family:"Fuzzy Bubbles",cursive;font-size:22px;color:#6f5f47;-webkit-text-stroke:.7px currentColor;height:100px;overflow:hidden;transition:opacity .3s ease;white-space:pre-line}
.loading .msg.fading{opacity:0}
.loading .dots{font-family:"Fuzzy Bubbles",cursive;font-size:26px;color:#6f5f47;-webkit-text-stroke:.7px currentColor;margin-top:4px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-14px) rotate(6deg)}}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
.loading .dots span{animation:blink 1.2s infinite}
.loading .dots span:nth-child(2){animation-delay:.2s}
.loading .dots span:nth-child(3){animation-delay:.4s}

/* ===== milestone page — open notebook two-page spread ===== */
.milestone{display:flex;height:100%;position:relative}

.page-left,.page-right{flex:1 1 50%;min-width:0;display:flex;flex-direction:column;position:relative;padding:44px 30px 40px}
.page-left{align-items:center;justify-content:center;border-right:1px dashed rgba(120,95,70,.22)}
.page-right{justify-content:center;text-align:left}

.polaroid-wrap{position:relative;width:min(100%,420px);display:flex;justify-content:center;transform:translateY(-40px)}
.polaroid{background:#fbfbf4;padding:20px 12px 34px;box-shadow:0 10px 24px rgba(0,0,0,.28);transform:rotate(-1.2deg);position:relative;border:1px solid #eee;border-radius:2px;max-width:100%}
.polaroid .photo{display:block;background:#e6ddc8;border:1px solid rgba(0,0,0,.15);border-radius:1px;max-width:100%;height:auto}
.polaroid.portrait .photo{height:min(52vh,430px);width:auto;margin:0 auto}
.polaroid.landscape .photo{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fbfbf4}
.polaroid .photo.fallback{display:grid;place-items:center;font-size:84px;width:100%;aspect-ratio:4/3;background:radial-gradient(circle, #f0e6d2, #dfd0b4)}
.polaroid .caption{margin-top:6px;text-align:center;font-family:"Fuzzy Bubbles",cursive;font-size:18px;color:#4a4034;-webkit-text-stroke:.45px currentColor;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35;padding:0 10px}

/* single short tape with torn serrated ends */
.tape{
  position:absolute;width:78px;height:26px;top:-13px;left:50%;transform:translateX(-50%) rotate(-2deg);z-index:3;
  --td:6px;
  clip-path:polygon(
    0 0, var(--td) 22%, 0 44%, var(--td) 66%, 0 88%, 0 100%,
    100% 100%, calc(100% - var(--td)) 78%, 100% 56%, calc(100% - var(--td)) 34%, 100% 12%, 100% 0,
    0 0
  );
  background:#dbcaa2;
  box-shadow:
    0 2px 7px rgba(0,0,0,.48),
    0 0 0 1px rgba(110,92,60,.30),
    inset 0 1px 0 rgba(255,255,255,.45),
    inset 0 -1px 0 rgba(120,100,70,.30);
}
.tape::after{
  content:"";position:absolute;inset:0;
  clip-path:inherit;
  background:linear-gradient(100deg, transparent 16%, rgba(255,255,255,.55) 36%, transparent 50%, rgba(255,255,255,.32) 72%, transparent 88%);
}

.notes{font-family:"Fuzzy Bubbles",cursive;color:#3b3226;padding:0 4px 0 30px}
.notes .mname{font-size:30px;line-height:1.15;font-weight:400;-webkit-text-stroke:.7px currentColor;color:#2f251b}
.notes .myear{font-size:18px;color:#8a7a5f;margin-top:2px;font-weight:400;-webkit-text-stroke:.45px currentColor}
.notes .mrow{margin-top:12px;font-size:20px;line-height:1.45;white-space:pre-wrap;word-break:break-word;-webkit-text-stroke:.45px currentColor}
/* màn thấp (laptop 768px trở xuống, tính cả thanh trình duyệt) — co chữ để story 900 ký tự không tràn mép trang */
@media(max-height:820px){
  .notes .mrow{font-size:18px;margin-top:10px}
}
@media(max-height:700px){
  .notes .mrow{font-size:15px;line-height:1.35;margin-top:8px}
  .hook-sapo{font-size:20px;line-height:1.5}
}
.notes .mrow b{color:#5a4430;font-weight:700}

.wiki-source-wrap{margin-top:14px;display:inline-flex;align-items:center;gap:6px;font-size:16px;color:#7a6953;font-family:"Fuzzy Bubbles",cursive;font-weight:400;-webkit-text-stroke:.45px currentColor}
.wiki-label{font-family:"Fuzzy Bubbles",cursive;font-size:16px;color:#7a6953;font-weight:400;-webkit-text-stroke:.45px currentColor}
.wiki-source{position:relative;display:inline-block;font-family:"Fuzzy Bubbles",cursive;font-size:16px;color:#1a73e8;text-decoration:none;background:transparent;padding:0 2px 4px;border-radius:0;transition:color .2s ease;font-weight:400;-webkit-text-stroke:.45px currentColor}
.wiki-source:hover{color:#1557b0;background:transparent}
.blue-underline{position:absolute;left:0;right:0;bottom:-2px;width:100%;height:13px;object-fit:fill;pointer-events:none;opacity:.95;display:block}

/* ===== hook/sapo page — winding river overview (left) + sapo (right) ===== */
.hook-left{display:flex;align-items:center;justify-content:center;height:100%;width:100%;position:relative}
.hook-svg{position:absolute;inset:0;width:100%;height:100%}
.hook-right{display:flex;flex-direction:column;justify-content:center;height:100%;overflow:hidden;padding:0 6px}
.hook-sapo{font-family:"Fuzzy Bubbles",cursive;font-size:24px;line-height:1.65;color:#3b3226;font-weight:400;-webkit-text-stroke:.7px currentColor}
.hook-sapo::first-letter{font-size:34px;color:#6b442b;font-weight:400}

.hook-nodes{position:absolute;inset:0;pointer-events:none}
/* container vo~ pointer-events de khong chan flip-zone; rieng anh mini van bam duoc (lightbox) */
.hook-nodes img{pointer-events:auto}
.hook-node{position:absolute;display:flex;align-items:center;gap:7px;opacity:0;animation:hookNodeIn .5s ease-out forwards}
.hook-node .hook-photo{object-fit:cover;background:#e6ddc8;display:block}
.hook-node .hook-polaroid{background:#fbfbf4;padding:5px 5px 10px;box-shadow:0 4px 12px rgba(0,0,0,.28);border:1px solid #e8e0d0;border-radius:1px;transform:rotate(-2deg);display:flex;align-items:center;justify-content:center}
.hook-node.right .hook-polaroid{transform:rotate(2deg)}
.hook-node .hook-polaroid .hook-photo{border:none;box-shadow:none;transform:none !important}
.hook-node.right .hook-photo{transform:rotate(2deg)}
.hook-node .hook-photo-fallback{display:grid;place-items:center;font-size:24px}
.hook-node .hook-year{font-family:"Fuzzy Bubbles",cursive;font-size:15px;font-weight:400;-webkit-text-stroke:.45px currentColor;color:#8a7a5f;white-space:normal;max-width:130px;line-height:1.3;text-align:center}
@keyframes hookNodeIn{from{opacity:0}to{opacity:1}}

/* ===== page flip affordance — per leaf, 3deg, no jitter ===== */
.flip-zone{position:absolute;top:0;bottom:0;width:64px;z-index:12;cursor:pointer}
.flip-zone.prev{left:0}
.flip-zone.next{right:0}

/* leaf edge lift — origin fixed per leaf */
.book{transition:filter .5s ease}
.leaf{transition:transform .5s cubic-bezier(.22,.7,.2,1);will-change:transform}
.book.hover-next .leaf-right{transform:rotateY(-3deg)}
.book.hover-prev .leaf-left{transform:rotateY(3deg)}
.book.hover-next{filter:drop-shadow(0 46px 54px rgba(0,0,0,.55)) drop-shadow(16px 6px 14px rgba(0,0,0,.26))}
.book.hover-prev{filter:drop-shadow(0 46px 54px rgba(0,0,0,.55)) drop-shadow(-16px 6px 14px rgba(0,0,0,.26))}
.leaf::before{content:"";position:absolute;top:0;bottom:0;width:100px;pointer-events:none;opacity:0;transition:opacity .4s ease;z-index:3}
.leaf::after{content:"";position:absolute;top:0;bottom:0;width:2px;pointer-events:none;opacity:0;transition:opacity .4s ease;z-index:3;background:rgba(255,255,255,.8)}
.book.hover-next .leaf-right::before{right:0;opacity:1;background:linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.10) 50%, rgba(0,0,0,.18) 100%)}
.book.hover-prev .leaf-left::before{left:0;opacity:1;background:linear-gradient(270deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.10) 50%, rgba(0,0,0,.18) 100%)}
.book.hover-next .leaf-right::after{right:0;opacity:.85}
.book.hover-prev .leaf-left::after{left:0;opacity:.85}

/* error state */
.error-box{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:24px}
.error-icon{font-size:48px;margin-bottom:12px}
.error-title{font-family:"Playfair Display",serif;font-size:24px;color:#6b352b;font-weight:700}
.error-desc{font-family:"Fuzzy Bubbles",cursive;font-size:20px;color:#5a493a;-webkit-text-stroke:.45px currentColor;margin-top:10px;line-height:1.45}

/* chrome của trang đơn mobile — ẩn trên desktop, và cả khi sổ đang đóng (bìa phủ)*/
.m-zone,.m-pageno,.m-topbar{display:none}

/* ===== mobile — sổ một trang / lần (single-page mode, chot 05/09 qua artifacts/mobile-ui-spec.md)
   Trang giấy chiếm gần hết màn hình, còn lộ viền da + nền bàn.
   Lật bằng quét ngang hoặc bấm mép trang (cao đúng bằng trang giấy);
   guide là trang riêng sau bìa; nội dung dài thì cuộn bên trong trang. ===== */

  .book.spread{width:min(92vw,560px);aspect-ratio:auto;height:calc(100vh - 32px);height:calc(100dvh - 32px)}
  .book.spread .page-block{display:none}
  .book.spread .page-single{display:block}
  .page-single{perspective:2400px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
  .page-single .spine{display:none} /* bo gáy nâu + đường khâu nét đứt — trang đơn mobile không cần gáy */
  .page-single input{user-select:text;-webkit-user-select:text}
  .page-single img{-webkit-user-drag:none}
  .page-single .inner{left:0;padding:34px 18px 30px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  /* vùng bấm mép trang (trong suốt — hướng dẫn lật nằm ở trang guide) */

  .page-single.nav-next-ok .m-zone.next{opacity:1;pointer-events:auto}

  .m-hook .hook-left{height:100%}

  .m-hook-sapo .hook-right{height:auto}
  .m-hook-sapo .hook-sapo{font-size:19px;line-height:1.7}
  .hook-node .hook-year{max-width:78px;font-size:12px}
  /* milestone — polaroid trên, meta + story dưới; tràn thì cuộn trong trang */
  .polaroid-wrap{transform:none;width:min(100%,340px);margin-top:2px}
  .polaroid{padding:12px 10px 22px}
  .polaroid.portrait .photo{height:min(34vh,300px);height:min(34dvh,300px)}

  .left-meta{margin-top:10px;gap:3px}

  .notes{padding:0 2px 0 6px;margin-top:14px}

  /* milestone tách 2 trang như desktop: trang ảnh (căn giữa dọc) -> lật -> trang chữ (đọc từ trên);

function renderLangRibbons(){

  const notchIn = Math.max(RIBBON.notch - RIBBON.borderW, 3);
  wrap.innerHTML = ['vi','en'].map(lg => {

      `<div class="rb-inner" style="inset:${RIBBON.borderW}px;clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - ${notchIn}px),0 100%);inset:${cq(RIBBON.borderW)};clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - ${cq(notchIn)}),0 100%)">${art}</div></div>`;

function milestoneRightHTML(m){
  const esc = s => (s||"").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const nl2br = s => esc(s).replace(/\n/g,'<br>');
  // Auto-paragraph: model hay trả 1 khoi lien — tự tách câu thành 2-3 đoạn cân khi không có xuống dòng
  const autoParagraph = text => {
    const sentences = text.split(/(?<=[.!?…])\s+(?=\D)/).map(s=>s.trim()).filter(Boolean);
    if(sentences.length < 2) return text;
    const want = Math.min(3, Math.max(2, Math.round(sentences.length / 2)));
    if(sentences.length < want) return text;
    const lens = sentences.map(s=>s.length);
    const target = lens.reduce((a,b)=>a+b,0) / want;
    const groups = [];
    let cur = [], curLen = 0;
    for(let i=0;i<sentences.length;i++){
      cur.push(sentences[i]); curLen += lens[i];
      const remainS = sentences.length - i - 1;   // số câu chưa nhóm
      const remainG = want - groups.length - 1;   // số đoạn còn phải tạo
      if(remainG > 0 && (curLen >= target || remainS === remainG)){
        groups.push(cur.join(' ')); cur = []; curLen = 0;
      }
    }
    if(cur.length) groups.push(cur.join(' '));
    return groups.join('\n\n');
  };
  const raw = m.story || (m.what ? `${m.what} ${m.why||''}`.trim() : '');
  const story = raw.includes('\n') ? raw : autoParagraph(raw);
  // story is continuous prose with paragraphs separated by \n\n — render as spaced paragraphs
  const paragraphs = story.split(/\n\s*\n/).map(p => `<div class="mrow">${nl2br(p.trim())}</div>`).join('');
  return `
        <div class="notes">
          ${paragraphs || `<div class="mrow" style="opacity:.4">—</div>`}
        </div>`;
}

function positionHookNodes(){
  const path = $("hookRiverPath"), wrap = $("hookNodes"), container = $("hookLeft");
  if(!path || !wrap || !container) return;
  const N = currentMilestones.length;
  const total = path.getTotalLength();
  const W = container.clientWidth;
  const mobileBook = book.classList.contains("mobile");
  // official: polaroid, 80px for 7 nodes, 100px for 5-6 nodes (long edge); mobile co lai cho vua trang doc
  const longEdge = mobileBook ? 64 : (N === 7 ? 80 : 100);
  const shortEdge = Math.round(longEdge * 0.75);
  const offset = Math.max(mobileBook ? 40 : 46, W * (mobileBook ? 0.14 : 0.17), longEdge * 0.5 + (mobileBook ? 16 : 22));
  const drawDur = 1.6;
  wrap.innerHTML = "";
  currentMilestones.forEach((m, i) => {
    const t = (i + 0.5) / N;
    const pt = path.getPointAtLength(total * t);
    const dir = (i % 2 === 0) ? -1 : 1;
    const node = document.createElement("div");
    node.className = "hook-node " + (dir < 0 ? "left" : "right");
    node.style.left = pt.x + "%";
    node.style.top = pt.y + "%";
    node.style.transform = `translate(calc(-50% + ${dir * offset}px), -50%)`;
    node.style.animationDelay = (0.2 + t * drawDur) + "s";
    const year = m.period || m.year || "";
    const isFallback = !m.img;
    const fallbackStyle = `width:${longEdge}px;height:${shortEdge}px`;
    const imgInner = m.img
      ? `<img class="hook-photo landscape" src="${m.img}" alt="${m.title || m.name || ''}" style="width:${longEdge}px;height:${shortEdge}px" onload="fixHookPhotoOrientation(this, ${longEdge}, ${shortEdge})" onerror="this.style.display='none'">`
      : `<div class="hook-photo hook-photo-fallback landscape" style="${fallbackStyle};display:grid;place-items:center;font-size:22px;background:#e6ddc8;border:1px solid rgba(0,0,0,.15)">📜</div>`;
    const polaroid = `<div class="hook-polaroid">${imgInner}</div>`;
    node.innerHTML = dir < 0
      ? `<span class="hook-year">${year}</span>${polaroid}`
      : `${polaroid}<span class="hook-year">${year}</span>`;
    wrap.appendChild(node);
    // giữ node nằm trọn trong trang — nhãn năm dài sẽ tràn mép nếu không kẹp lại
    const nodeW = node.offsetWidth;
    if(nodeW){
      const pad = 8;
      const edge = pt.x / 100 * W - nodeW / 2 + dir * offset;
      let shiftX = 0;
      if(dir > 0 && edge + nodeW > W - pad) shiftX = (W - pad) - (edge + nodeW);
      if(dir < 0 && edge < pad) shiftX = pad - edge;
      if(shiftX) node.style.transform = `translate(calc(-50% + ${dir * offset + shiftX}px), -50%)`;
    }
  });
}

// read real image dimensions once loaded; portrait photos stand upright, landscape stay horizontal
function fixPhotoOrientation(img){
  const pol = img.closest(".polaroid");
  if(!pol) return;
  const portrait = img.naturalHeight > img.naturalWidth;
  pol.classList.toggle("portrait", portrait);
  pol.classList.toggle("landscape", !portrait);
}
function fixHookPhotoOrientation(img, longEdge, shortEdge){
  const isPortrait = img.naturalHeight > img.naturalWidth;
  img.classList.toggle("portrait", isPortrait);
  img.classList.toggle("landscape", !isPortrait);
  // swap dimensions so long edge stays long (portrait = tall)
  if(isPortrait){
    img.style.width = shortEdge + 'px';
    img.style.height = longEdge + 'px';
  } else {
    img.style.width = longEdge + 'px';
    img.style.height = shortEdge + 'px';
  }
}

function formatYearWithRelation(yearStr){
  if(!yearStr) return yearStr;
  const nowYear = new Date().getFullYear();
  // thang lớn / giai đoạn tương đối (vũ trụ, tiền sử) — công thức trừ năm vô nghĩa, hiển thị nguyên văn
  if(/\d{1,3}(?:[.,]\d{3})+/.test(yearStr)) return yearStr; // số có dấu chia nghìn (380.000, 13,8 tỷ...)
  if(/triệu|million|tỷ|billion|big bang|năm sau|years? after|năm ánh sáng|light[- ]?years?/i.test(yearStr)) return yearStr;
  const allNums = yearStr.match(/\d{3,4}/g);
  if(!allNums) return yearStr;
  const yearNum = parseInt(allNums[allNums.length-1],10);
  const isBCE = /TCN|BC/i.test(yearStr);
  if(isBCE){
    const delta = yearNum + nowYear;
    if(delta > 100000) return yearStr; // quá xa lịch sử nhân loại
    return `${yearStr} (${delta} ${L().yearAgo})`;
  } else {
    if(yearNum > nowYear) return yearStr;
    const delta = nowYear - yearNum;
    if(delta <= 0) return yearStr;
    if(delta > 100000) return yearStr;
    return `${yearStr} (${delta} ${L().yearAgo})`;
  }
}

    return;
  }
  if(phase !== "milestone") return;
  if(dir > 0 && mSheet < mobileSheetTotal() - 1) mobileGoSheet(mSheet + 1, 1);
  else if(dir < 0 && mSheet > 0) mobileGoSheet(mSheet - 1, -1);
}
// vuốt ngang để lật trang — pan-y giữ nguyên cuộn dọc cho nội dung dài
let mSwipe = null;
pageSingle.addEventListener("pointerdown", e => { mSwipe = { x: e.clientX, y: e.clientY, t: Date.now() }; });
pageSingle.addEventListener("pointercancel", () => { mSwipe = null; });
pageSingle.addEventListener("pointerup", e => {
  if(!mSwipe) return;
  const dx = e.clientX - mSwipe.x, dy = e.clientY - mSwipe.y, dt = Date.now() - mSwipe.t;
  mSwipe = null;
  if(dt > 700 || Math.abs(dx) < 56 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
  if(String(window.getSelection())) return; // đang bôi đen chữ thì không tính là lật
  mobileNav(dx < 0 ? 1 : -1);
});
// rẽ giữa mobile/desktop lúc dang dở — về bìa, giữ lại chữ đang gõ dở
function applyMobileMode(){
  const m = mobileMQ.matches;
  if(book.classList.contains("mobile") === m) return;
  runId++;
  clearInterval(loadingTimer);
  const oldScope = book.classList.contains("mobile") ? pageSingleInner : leafRightInner;
  const input = oldScope.querySelector("#topicInput");
  if(input && input.value) promptDraft = input.value;
  phase = "cover";
  book.classList.toggle("mobile", m);
  book.classList.remove("spread", "prompt");
  cover.style.display = "";
  cover.classList.remove("open");
  mobilePage = "guide";
  mSheet = 0;
  mobileFlipping = false;
  pageSingle.querySelectorAll(".mflip-sheet").forEach(s => s.remove());
  if(m) mobileRenderDest("guide"); else setPageSingle(promptHTML());
}
if(mobileMQ.addEventListener) mobileMQ.addEventListener("change", applyMobileMode);
else if(mobileMQ.addListener) mobileMQ.addListener(applyMobileMode);

// gắn sự kiện cho trang prompt (input, nút khám phá, chips gợi ý) — dùng chung desktop/mobile
function bindPromptPage(scope){
  const input = scope.querySelector("#topicInput") || $("topicInput");
  const btn = scope.querySelector("#btnExplore") || $("btnExplore");
  const counter = scope.querySelector("#charCounter");
  function updateCounter(){ if(counter && input) counter.textContent = input.value.length + "/20"; }
  if(input) {
    // trả lại chữ đang gõ dở nếu vừa quay về bìa rồi mở lại
    if(promptDraft){ input.value = promptDraft; promptDraft = ""; }
    // desktop tự focus; mobile để người dùng chạm vào ô mới hiện bàn phím
    if(!book.classList.contains("mobile")) setTimeout(()=> input.focus(), 50);
    updateCounter();
    input.addEventListener("input", updateCounter);
    input.addEventListener("keydown", e => {
      if(e.key === "Enter") {
        const val = input.value.trim().slice(0,20);
        if(val) startAIJourney(val);
      }
    });
  }

  if(btn) {
    btn.addEventListener("click", () => {
      const inp = scope.querySelector("#topicInput");
      const val = inp ? inp.value.trim().slice(0,20) : "";
      if(val) startAIJourney(val);
    });
  }

  scope.querySelectorAll(".sug-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const t = chip.dataset.topic;
      if(t) startAIJourney(t.slice(0,20));
    });
  });

  initTypedPlaceholder(scope);
}

// ô dán API key trên trang hướng dẫn — nguồn duy nhất để lưu/gỡ key (modal cũ đã bỏ)
function bindGuideKey(scope){
  const guideKey = scope.querySelector("#guideKeyInput");
  if(!guideKey) return;
  const keyClearBtn = scope.querySelector("#guideKeyClear");
  const updateKeyClear = () => { if(keyClearBtn) keyClearBtn.style.display = getUserKey() ? "grid" : "none"; };
  if(getUserKey()) guideKey.placeholder = L().byok.placeholderSaved;
  guideKey._skipEmptyOnce = false;
  const saveGuideKey = () => {
    const v = guideKey.value.trim();
    if(!v) return;
    try{ localStorage.setItem('evoluthing_user_key', v); }catch{}
    guideKey.value = "";
    guideKey.placeholder = L().byok.placeholderSaved;
    updateKeyClear();
  };
  guideKey.addEventListener("change", () => {
    const wasPaste = guideKey._skipEmptyOnce;
    guideKey._skipEmptyOnce = false;
    const v = guideKey.value.trim();
    if(v){ saveGuideKey(); return; }
    if(wasPaste) return; // change rỗng ngay sau paste — đừng gỡ key vừa lưu
    try{ localStorage.removeItem('evoluthing_user_key'); }catch{}
    guideKey.placeholder = L().byok.placeholder;
    updateKeyClear();
  });
  guideKey.addEventListener("paste", () => { guideKey._skipEmptyOnce = true; setTimeout(saveGuideKey, 0); });
  if(keyClearBtn) keyClearBtn.addEventListener("click", () => {
    try{ localStorage.removeItem('evoluthing_user_key'); }catch{}
    guideKey.value = "";
    guideKey.placeholder = L().byok.placeholder;
    updateKeyClear();
    guideKey.focus();
  });
  updateKeyClear();
}

function showPrompt(){
  phase = "prompt";
  book.classList.add("spread");
  book.classList.remove("loading");
  const mobile = book.classList.contains("mobile");
  if(mobile){
    // lần mở bìa đầu hiện trang guide, sau đó tới thẳng trang prompt; từ trang lỗi lật ngược về prompt
    const first = mobileFirstOpen;
    mobileFirstOpen = false;
    mobileShow(first ? "guide" : "prompt", mobilePage === "error" ? -1 : 0);
    return;
  }
  book.classList.add("prompt");
  // left = guide page, right prompt (bung 2 mặt)
  leafLeftInner.innerHTML = guideHTML();
  leafRightInner.innerHTML = promptHTML();
  milestoneTopicEl.style.display = "none";
  pagenoEl.style.display = "none";
  bindPromptPage(leafRightInner);
  bindGuideKey(leafLeftInner);
}

let typedTimer = null;
function initTypedPlaceholder(scope){
  clearInterval(typedTimer); clearTimeout(typedTimer);
  const input = scope.querySelector("#topicInput");
  const holder = scope.querySelector("#typedPlaceholder");
  const textEl = scope.querySelector("#typedText");
  if(!input || !holder || !textEl) return;
  const phrases = L().typing;
  let pIdx = 0, cIdx = 0, deleting = false;
  const typeSpeed = 180, deleteSpeed = 100, holdAfterType = 3000, holdAfterDelete = 1000;

  function updateVisibility(){
    const hasValue = input.value.length > 0;
    holder.classList.toggle("hidden", hasValue);
  }
  // hide when user types
  input.addEventListener("input", updateVisibility);
  input.addEventListener("focus", updateVisibility);
  input.addEventListener("blur", ()=> setTimeout(updateVisibility,80));
  updateVisibility();

  function tick(){
    const full = phrases[pIdx];
    if(!deleting){
      cIdx++;
      textEl.textContent = full.slice(0,cIdx);
      updateVisibility();
      if(cIdx >= full.length){
        typedTimer = setTimeout(()=>{ deleting = true; tick(); }, holdAfterType);
        return;
      }
      typedTimer = setTimeout(tick, typeSpeed);
    } else {
      cIdx--;
      textEl.textContent = full.slice(0,cIdx);
      if(cIdx <= 0){
        deleting = false;
        pIdx = (pIdx+1) % phrases.length;
        typedTimer = setTimeout(tick, holdAfterDelete);
        return;
      }
      typedTimer = setTimeout(tick, deleteSpeed);
    }
  }
  tick();
  // stop typing when leaving prompt phase
  const stop = ()=>{ clearTimeout(typedTimer); };
  holder._stopTyped = stop;
}
// sound lật trang — phát mỗi lần giấy lật (mở bìa, gập về bìa, lật trái/phải)
const flipSfx = new Audio('sounds/page-flip.m4a');
flipSfx.preload = 'auto';
function playFlipSfx(){
  try{
    flipSfx.currentTime = 0;
    const p = flipSfx.play();
    if(p && p.catch) p.catch(() => {}); // trình duyệt chặn autoplay thì bỏ qua im lặng
  }catch{}
}
function openCover(){
  if(phase !== "cover") return;
  cover.classList.add("open");
  playFlipSfx();
  showPrompt();
  setTimeout(()=>{ cover.style.display = "none"; }, 950);
}

// từ trang hướng dẫn, mép trái đóng sổ quay về bìa — để đổi ngôn ngữ
let promptDraft = "";
function closeToCover(){
  if(phase !== "prompt") return;
  const mobile = book.classList.contains("mobile");
  const input = (mobile ? pageSingleInner : leafRightInner).querySelector("#topicInput");
  promptDraft = input ? input.value : "";
  clearInterval(typedTimer); clearTimeout(typedTimer);
  phase = "cover";
  playFlipSfx();
  book.classList.remove("spread", "prompt");
  cover.style.display = "";
  // ép trình duyệt tính layout ở trạng thái mở trước, rồi mới hả class để chạy animation gập
  void cover.offsetHeight;
  cover.classList.remove("open");
}

async function startAIJourney(topic){
  clearTimeout(typedTimer);
  phase = "loading";
  currentTopic = topic;
  const mobile = book.classList.contains("mobile");
  const myRun = ++runId; // một lượt generate mới vô hiệu lượt cũ đang treo
  // keep spread (prompt was spread), show loading on right leaf with left blank
  book.classList.add("spread");
  book.classList.remove("prompt");
  // xáo trộn thứ tự fact mỗi lượt generate (Fisher-Yates) — không luôn thấy cùng nhóm fact đầu
  const factOrder = (() => {
    const a = [...L().loading];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  })();
  if(mobile){
    currentFactOrder = factOrder;
    mobileShow("loading", 1);
  } else {
    leafLeftInner.innerHTML = "";
    leafRightInner.innerHTML = loadingHTML(topic, factOrder);
    milestoneTopicEl.style.display = "none";
    pagenoEl.style.display = "none";
  }

  let msgIdx = 0;
  clearInterval(loadingTimer);
  // fact vui 7s/câu — đổi câu bằng hiệu ứng mờ dần, chạy theo thứ tự đã xáo trộn
  loadingTimer = setInterval(() => {
    msgIdx = (msgIdx + 1) % factOrder.length;
    const msgEl = (mobile ? pageSingleInner : leafRightInner).querySelector("#loadingMsg") || $("loadingMsg");
    if(!msgEl) return;
    msgEl.classList.add("fading");
    setTimeout(() => {
      msgEl.innerText = factOrder[msgIdx];
      msgEl.classList.remove("fading");
    }, 300);
  }, 7000);

  try {
    const res = await fetch("/api/evolution", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topic, lang: currentLang, userKey: getUserKey() })
    });
    if(runId !== myRun) return; // đã đổi chế độ giữa chừng — bỏ kết quả

    clearInterval(loadingTimer);

    if(!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.error || L().fallbackError);
    }

    const data = await res.json();
    if(runId !== myRun) return;
    if(data.milestones && data.milestones.length > 0) {
      currentMilestones = data.milestones;
      console.log('[Evoluthing] milestones debug:', currentMilestones.map(m => ({ title: m.title, period: m.period, visualSubject: m.visualSubject, wikipediaTitle: m.wikipediaTitle, hasImg: !!m.img, wikiUrl: m.wikiUrl })));
      currentStoryTitle = data.title || L().storyFallback(topic);
      currentLang = data.lang || currentLang;
      currentHook = data.hook || "";
      pageIndex = 0;
      if(mobile){ mSheet = 0; phase = "milestone"; mobileShow("hookRiver", 1); }
      else showPage(1);
    } else {
      throw new Error(L().noDataError);
    }
  } catch (err) {
    if(runId !== myRun) return;
    clearInterval(loadingTimer);
    phase = "error";
    if(mobile){
      lastError = err.message || L().genericError;
      mobileShow("error", 1);
      return;
    }
    book.classList.remove("prompt");
    // show error on right leaf keeping spread, left blank
    leafLeftInner.innerHTML = "";
    leafRightInner.innerHTML = errorHTML(err.message || L().genericError);
    // wire error button to showPrompt
    const errBtn = leafRightInner.querySelector(".btn-explore");
    if(errBtn) errBtn.addEventListener("click", showPrompt);
  }
}

function doLeafFlip(dir){
  playFlipSfx();
  const leaf = dir > 0 ? leafRight : leafLeft;
  // create double-sided clone so it stays visible as blank after 90deg
  const clone = document.createElement("div");
  // do not copy leaf class overflow/backface that would hide back
  clone.style.position = "absolute";
  clone.style.top = "0";
  clone.style.bottom = "0";
  clone.style.width = "50%";
  clone.style.zIndex = "25";
  clone.style.transition = "transform .5s ease";
  clone.style.willChange = "transform";
  clone.style.transformStyle = "preserve-3d";
  clone.style.overflow = "visible";
  clone.style.background = "transparent";
  clone.style.borderRadius = getComputedStyle(leaf).borderRadius;
  if(dir > 0){
    clone.style.left = "50%";
    clone.style.transformOrigin = "left center";
  } else {
    clone.style.left = "0";
    clone.style.transformOrigin = "right center";
  }
  // front face blank — trắng tinh quét ngay, không thấy nội dung cũ
  const front = document.createElement("div");
  front.style.position = "absolute";
  front.style.inset = "0";
  front.style.backfaceVisibility = "hidden";
  front.style.background = getComputedStyle(leaf).background;
  front.style.borderRadius = getComputedStyle(leaf).borderRadius;
  front.style.overflow = "hidden";
  front.style.display = "flex";
  front.style.flexDirection = "column";
  front.innerHTML = `<div class="leaf-inner" style="justify-content:center;align-items:center"></div>`;
  // back face blank paper
  const back = document.createElement("div");
  back.style.position = "absolute";
  back.style.inset = "0";
  back.style.backfaceVisibility = "hidden";
  back.style.transform = "rotateY(180deg)";
  back.style.background = getComputedStyle(leaf).background;
  back.style.borderRadius = getComputedStyle(leaf).borderRadius;
  back.style.overflow = "hidden";
  clone.appendChild(front);
  clone.appendChild(back);
  pageBlock.appendChild(clone);
  // underneath leaves become 2 blank pages (kept behind clone)
  leafLeftInner.innerHTML = "";
  leafRightInner.innerHTML = "";
  milestoneTopicEl.style.display = "none";
  pagenoEl.style.display = "none";
  // trigger sweep fully across — 0.5s
  requestAnimationFrame(()=>{
    clone.style.transform = `rotateY(${dir > 0 ? -179 : 179}deg)`;
  });
  setTimeout(()=>{
    clone.remove();
    // now 2 blanks side by side visible, fade in next spread on both together
    leafLeftInner.style.opacity = "0";
    leafRightInner.style.opacity = "0";
    leafLeftInner.style.transition = "none";
    leafRightInner.style.transition = "none";
    renderCurrentPage();
    milestoneTopicEl.style.display = "";
    pagenoEl.style.display = "";
    milestoneTopicEl.style.opacity = "0";
    pagenoEl.style.opacity = "0";
    milestoneTopicEl.style.transition = "none";
    pagenoEl.style.transition = "none";
    void leafLeftInner.offsetWidth;
    leafLeftInner.style.transition = "opacity .5s ease";
    leafRightInner.style.transition = "opacity .5s ease";
    milestoneTopicEl.style.transition = "opacity .5s ease";
    pagenoEl.style.transition = "opacity .5s ease";
    requestAnimationFrame(()=>{
      leafLeftInner.style.opacity = "1";
      leafRightInner.style.opacity = "1";
      milestoneTopicEl.style.opacity = "1";
      pagenoEl.style.opacity = "1";
    });
    setTimeout(()=>{
      leafLeftInner.style.transition = "";
      leafRightInner.style.transition = "";
      milestoneTopicEl.style.transition = "";
      pagenoEl.style.transition = "";
      milestoneTopicEl.style.opacity = "";
      pagenoEl.style.opacity = "";
      leafLeftInner.style.opacity = "";
      leafRightInner.style.opacity = "";
    }, 550);
  }, 520);
}

function showPage(dir){
  phase = "milestone";
  book.classList.add("spread");
  book.classList.remove("prompt");
  if(dir){
    doLeafFlip(dir);
  } else {
    milestoneTopicEl.style.display = "";
    pagenoEl.style.display = "";
    renderCurrentPage();
  }
}

function next(){
  if(phase !== "milestone") return;
  if(book.classList.contains("mobile")){ mobileNav(1); return; }
  if(pageIndex >= totalPages() - 1) return;
  pageIndex++;
  showPage(1);
}

function prev(){
  if(phase !== "milestone") return;
  if(book.classList.contains("mobile")){ mobileNav(-1); return; }
  if(pageIndex <= 0) return;
  pageIndex--;
  showPage(-1);
}

// cover opens on click
cover.addEventListener("click", openCover);

// apply saved language to the cover (palette, title, ribbons) on load
applyCoverLang();

// keyboard navigation
window.addEventListener("keydown", e => {
  if(phase !== "milestone") return;
  if(e.key === "ArrowRight") next();
  if(e.key === "ArrowLeft") prev();
});

// click to flip
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-nav]");
  if(!nav) return;
  // mobile: vùng mép trang — guide sang trang prompt, guide/prompt lùi về bìa, milestone lật tới/lui
  if(book.classList.contains("mobile")){ mobileNav(nav.dataset.nav === "next" ? 1 : -1); return; }
  // trang hướng dẫn: mép trái quay về bìa (để đổi ngôn ngữ)
  if(nav.dataset.nav === "prev" && phase === "prompt"){ closeToCover(); return; }
  if(nav.dataset.nav === "next") next();
  if(nav.dataset.nav === "prev") prev();
});

// hover curl effect
document.addEventListener("mouseover", e => {
  const zone = e.target.closest(".flip-zone");
  if(zone){
    book.classList.toggle("hover-next", zone.dataset.nav === "next");
    book.classList.toggle("hover-prev", zone.dataset.nav === "prev");
  }
});
document.addEventListener("mouseout", e => {
  const zone = e.target.closest(".flip-zone");
  if(zone){
    book.classList.remove("hover-next", "hover-prev");
  }
});

// lightbox — bấm ảnh polaroid xem toàn màn hình, bấm nền tối (ngoài ảnh) để đóng
const lightbox = document.createElement("div");
lightbox.id = "lightbox";
lightbox.className = "lightbox";
lightbox.innerHTML = '<img alt="">';
document.body.appendChild(lightbox);
const lightboxImg = lightbox.querySelector("img");
function openLightbox(src, alt){
  lightboxImg.src = src;
  lightboxImg.alt = alt || "";
  lightbox.classList.add("show");
}
function closeLightbox(){ lightbox.classList.remove("show"); }
lightbox.addEventListener("click", e => { if(e.target !== lightboxImg) closeLightbox(); });
window.addEventListener("keydown", e => { if(e.key === "Escape") closeLightbox(); });
// capture phase: chặn trước các handler khác, không phá flip-zone/wiki
document.addEventListener("click", e => {
  const img = e.target.closest("img.photo, img.hook-photo");
  if(img && img.src){ e.stopPropagation(); e.preventDefault(); openLightbox(img.src, img.alt); }
}, true);

// start ready — mobile: nạp sẵn trang guide sau bìa; desktop: giữ trang prompt ẩn cũ
if(mobileMQ.matches){
  book.classList.add("mobile");
  mobileRenderDest("guide");
} else {
  setPageSingle(promptHTML());
}
